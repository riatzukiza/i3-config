# Helm spotlight: floating Emacs popup frame for helm finders.
# Match by Emacs class + frame instance (name parameter) set in err/helm-popup-frame-params.
for_window [class="^Emacs$" instance="^helm-popup$"] \
  floating enable, move position center, resize set 1200 500, border pixel 2

# Run on key release so modifiers don't steal focus from the popup frame.
bindsym --release $mod+Ctrl+f exec --no-startup-id ~/bin/helm-spotlight err/helm-popup-find-files
bindsym --release $mod+Ctrl+b exec --no-startup-id ~/bin/helm-spotlight err/helm-popup-list-buffers
bindsym --release $mod+Ctrl+r exec --no-startup-id ~/bin/helm-spotlight err/helm-popup-recentf
bindsym --release $mod+Ctrl+p exec --no-startup-id ~/bin/helm-spotlight err/helm-popup-switch-project
