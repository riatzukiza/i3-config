# Consult/Vertico minibuffer popup launcher frame.
for_window [class="^Emacs$" title="^emacs-launcher$"] \
  floating enable, move position center, resize set 1200 500, border pixel 2

# Modal "go" launcher: $mod+g enters mode, letter picks a Consult source.
set $mode_go Go: [g]o [f]iles [b]uffers [p]rojects [Esc]

mode "$mode_go" {
    bindsym Escape mode "default"
    bindsym Return mode "default"

    bindsym g exec --no-startup-id emacsclient -n -e '(my/launcher-go)'; mode "default"
    bindsym f exec --no-startup-id emacsclient -n -e '(my/launcher-files)'; mode "default"
    bindsym b exec --no-startup-id emacsclient -n -e '(my/launcher-buffers)'; mode "default"
    bindsym p exec --no-startup-id emacsclient -n -e '(my/launcher-projects)'; mode "default"
}

bindsym $mod+g mode "$mode_go"
bindsym $mod+Shift+Return exec --no-startup-id emacsclient -n -e '(my/new-vterm-dispatch)'
